<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180"><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#3A2418"/></marker></defs><rect width="1600" height="1180" fill="#F7EEDC"/><text x="800" y="50" font-family="Arial" font-size="34" fill="#3A2418" text-anchor="middle" font-weight="bold">Floor plan: gurukul archery ground (top-down, north up)</text><rect x="80" y="90" width="1440" height="300" fill="#E8D7B0" opacity=".6"/><text x="800" y="130" font-family="Arial" font-size="24" fill="#3A2418" text-anchor="middle" font-weight="normal">NORTH backdrop seen by C1: open field, hills, far trees</text><rect x="80" y="880" width="1440" height="200" fill="#D9B98C" opacity=".6"/><text x="800" y="1060" font-family="Arial" font-size="24" fill="#3A2418" text-anchor="middle" font-weight="normal">SOUTH backdrop seen by C2: ashram (huts, tulsi, well, mango tree, pots)</text><path d="M560,520 L1330,520" stroke="#C0392B" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#ah)"/><text x="950" y="505" font-family="Arial" font-size="22" fill="#C0392B" text-anchor="middle" font-weight="normal">arrow axis: ALWAYS screen-right in C1 (never crossed)</text><circle cx="1390" cy="520" r="46" fill="#4E9A5E" stroke="#3A2418" stroke-width="3"/><text x="1390" y="600" font-family="Arial" font-size="22" fill="#3A2418" text-anchor="middle" font-weight="normal">target tree (EAST)</text><text x="1390" y="470" font-family="Arial" font-size="20" fill="#3A2418" text-anchor="middle" font-weight="normal">wooden bird</text><path d="M540,440 L540,610" stroke="#8A5530" stroke-width="6"/><text x="540" y="640" font-family="Arial" font-size="20" fill="#3A2418" text-anchor="middle" font-weight="normal">firing line</text><circle cx="560" cy="520" r="22" fill="#1F8A8A" stroke="#3A2418" stroke-width="3"/><path d="M560,520 L560,554" stroke="#3A2418" stroke-width="5" marker-end="url(#ah)"/><text x="650" y="598" font-family="Arial" font-size="22" fill="#3A2418" text-anchor="middle" font-weight="normal">archer: chest faces C1, aims east</text><circle cx="440" cy="455" r="22" fill="#D9822B" stroke="#3A2418" stroke-width="3"/><path d="M440,455 L472,467" stroke="#3A2418" stroke-width="5" marker-end="url(#ah)"/><text x="440" y="419" font-family="Arial" font-size="22" fill="#3A2418" text-anchor="middle" font-weight="normal">Drona: 3/4, faces archer</text><circle cx="250" cy="430" r="22" fill="#E9A23B" stroke="#3A2418" stroke-width="3"/><path d="M250,430 L284,430" stroke="#3A2418" stroke-width="5" marker-end="url(#ah)"/><text x="250" y="480" font-family="Arial" font-size="22" fill="#3A2418" text-anchor="middle" font-weight="normal"></text><circle cx="250" cy="500" r="22" fill="#8E2B3A" stroke="#3A2418" stroke-width="3"/><path d="M250,500 L284,500" stroke="#3A2418" stroke-width="5" marker-end="url(#ah)"/><text x="250" y="550" font-family="Arial" font-size="22" fill="#3A2418" text-anchor="middle" font-weight="normal"></text><circle cx="250" cy="570" r="22" fill="#3E7D4F" stroke="#3A2418" stroke-width="3"/><path d="M250,570 L284,570" stroke="#3A2418" stroke-width="5" marker-end="url(#ah)"/><text x="250" y="620" font-family="Arial" font-size="22" fill="#3A2418" text-anchor="middle" font-weight="normal">waiting princes: 3/4 → east</text><circle cx="470" cy="760" r="22" fill="#E9A23B" stroke="#3A2418" stroke-width="3"/><path d="M470,760 L470,726" stroke="#3A2418" stroke-width="5" marker-end="url(#ah)"/><text x="470" y="810" font-family="Arial" font-size="22" fill="#3A2418" text-anchor="middle" font-weight="normal"></text><circle cx="650" cy="770" r="22" fill="#3E7D4F" stroke="#3A2418" stroke-width="3"/><path d="M650,770 L650,736" stroke="#3A2418" stroke-width="5" marker-end="url(#ah)"/><text x="650" y="820" font-family="Arial" font-size="22" fill="#3A2418" text-anchor="middle" font-weight="normal">watchers (BACK view in C1)</text><path d="M1560,250 m-30,0 a30,30 0 1,0 60,0 a30,30 0 1,0 -60,0" fill="#F7C46A"/><text x="1500" y="300" font-family="Arial" font-size="20" fill="#3A2418" text-anchor="middle" font-weight="normal">morning sun (EAST)</text><path d="M560,960 L539,994 L560,890 L581,994Z" fill="#FFD34D" stroke="#3A2418" stroke-width="3" opacity=".9"/><text x="620" y="968" font-family="Arial" font-size="24" fill="#3A2418" text-anchor="start" font-weight="bold">C1 main stage: looks NORTH</text><path d="M380,230 L401,196 L380,300 L359,196Z" fill="#9FC7D9" stroke="#3A2418" stroke-width="3" opacity=".9"/><text x="440" y="238" font-family="Arial" font-size="24" fill="#3A2418" text-anchor="start" font-weight="bold">C2 reverse: looks SOUTH</text><path d="M900,700 L865,719 L935,639 L901,740Z" fill="#E8E0F0" stroke="#3A2418" stroke-width="3" opacity=".9"/><text x="960" y="708" font-family="Arial" font-size="24" fill="#3A2418" text-anchor="start" font-weight="bold">SKY: tilt up / arrow follow</text><text x="90" y="1130" font-family="Arial" font-size="22" fill="#3A2418" text-anchor="start" font-weight="normal">Rules: archery is only shot from C1 (or SKY/POV, same screen direction). C2 never shows the firing line. Sun is right in C1, left in C2.</text><text x="90" y="1160" font-family="Arial" font-size="22" fill="#3A2418" text-anchor="start" font-weight="normal">Moves between setups: sky-tilt, wipe-by-figure, iris (POV), ripple/match dissolve ≤0.5 s. No cut inside a spoken phrase.</text></svg>